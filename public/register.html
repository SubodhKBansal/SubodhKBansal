<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bansal's Classes Registration</title>

    <link rel="stylesheet" href="register.css">

</head>

<body>

<div class="register-container">

    <h1>Bansal's Classes</h1>

    <h2>Student Registration</h2>

    <form id="registerForm">

    <div class="form-group">
        <label>Full Name</label>
        <input
            type="text"
            id="fullname"
            placeholder="Enter Full Name"
            required>
    </div>

    <div class="form-group">
        <label>Mobile Number</label>
        <input
            type="text"
            id="mobile"
            placeholder="Enter Mobile Number"
            required>
    </div>

    <div class="form-group">
        <label>Email ID</label>
        <input
            type="email"
            id="email"
            placeholder="Enter Email Address"
            required>
    </div>

    <!-- New Class/Standard Field -->
    <div class="form-group">
        <label>Class / Grade</label>
        <select id="studentClass" required>
            <option value="">-- Select Class --</option>
            <option value="6th">6th</option>
            <option value="7th">7th</option>
            <option value="8th">8th</option>
            <option value="9th">9th</option>
            <option value="10th">10th</option>
            <option value="11th (Medical)">11th (Medical)</option>
            <option value="11th (Non-Medical)">11th (Non-Medical)</option>
            <option value="12th (Medical)">12th (Medical)</option>
            <option value="12th (Non-Medical)">12th (Non-Medical)</option>
        </select>
    </div>

    <button
        type="submit"
        class="btn">
        Submit Registration
    </button>

</form>

</div>

<script src="script.js"></script>

</body>

</html>
